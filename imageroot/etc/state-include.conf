#
# automx state/backup include patterns for Restic
# Syntax reference: https://pkg.go.dev/path/filepath#Glob
# Restic --files-from: https://restic.readthedocs.io/en/stable/040_backup.html#including-files
# List here what you want to save during backup : volumes or file Path

# Per-domain enable/disable flags (DESIGN.md 4.2) and module settings
# (service host override, http2https default). state/environment is
# included automatically by the platform and is not listed here.
#
# automx.conf is NOT listed: it is regenerated on every service start
# from domains.json + settings.json + discovered LDAP/mail data, and it
# contains the LDAP bind password (DESIGN.md 4.2, 8).
state/domains.json
state/settings.json

