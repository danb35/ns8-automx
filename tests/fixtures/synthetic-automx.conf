# Synthetic automx.conf for the build-time smoke check in build-images.sh
# (DESIGN.md 9.1: "build image, run `automx config validate` and `automx
# render autoconfig|autodiscover|mobileconfig` against rendered configs
# with a synthetic address"). Shape matches exactly what
# imageroot/bin/render-automx-conf actually generates (same keys, same
# script-backend stanza) -- this is checking the automx-app image and this
# config shape work together, not exercising the renderer itself (that's
# tests/unit/test_render_automx_conf.py).
#
# No state/ldap-lookup.json exists during this check, so the script
# backend's own fallback path is what's actually exercised here -- the
# same thing confirmed manually against a real running container while
# implementing this (DESIGN.md 4.5's Containerfile verification note).

[automx]
provider = automx.ci-smoke-test.test
domains = ci-smoke-test.test
autodiscover_v2 = no

[global]
backend = script
script = /usr/local/bin/automx-ldap-lookup %u %d %s
result_attrs = login display_name
separator = |
imap = yes
imap_server = mail.ci-smoke-test.test
imap_port = 993
imap_encryption = ssl
imap_auth = plaintext
imap_auth_identity = ${login}
smtp = yes
smtp_server = mail.ci-smoke-test.test
smtp_port = 465
smtp_encryption = ssl
smtp_auth = plaintext
smtp_auth_identity = ${login}
account_name = ${display_name}
account_name_short = ${display_name}
